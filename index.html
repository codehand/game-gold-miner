<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <title>Cat Mine Idle</title>
    <style>
      #boot-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #030712;
        color: #fff;
        font: 600 18px system-ui, sans-serif;
        pointer-events: none;
        text-align: center;
      }
      #boot-status[hidden] { display: none; }
      #intro-screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background: #101b30;
        color: #fff7df;
        text-align: center;
      }
      #intro-screen .intro-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 480px);
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="game-viewport" data-testid="game-viewport"></div>
      <div id="boot-status" role="status" hidden>Đang tải game...</div>
      <section id="intro-screen" class="intro-screen" aria-labelledby="intro-title">
        <div class="intro-frame">
          <div class="intro-glow" aria-hidden="true"></div>
          <div class="intro-topline" aria-hidden="true"><span>✦</span> A LITTLE WORLD BELOW <span>✦</span></div>
          <div class="intro-hero" aria-hidden="true">
            <div class="intro-orbit intro-orbit-one"></div>
            <div class="intro-orbit intro-orbit-two"></div>
            <img class="intro-cat" src="/assets/marketplace/catalog/miner/n/mica/idle-1.png" alt="" />
            <span class="intro-spark intro-spark-one">✦</span>
            <span class="intro-spark intro-spark-two">✦</span>
            <span class="intro-spark intro-spark-three">✦</span>
          </div>
          <div class="intro-wordmark">
            <p class="intro-kicker">WELCOME TO</p>
            <h1 id="intro-title">CAT MINE <span>IDLE</span></h1>
            <p class="intro-tagline">Tiny miners. Big discoveries.</p>
          </div>
          <div class="intro-ground" aria-hidden="true">
            <div class="intro-rail"></div>
            <div class="intro-gem intro-gem-one"></div>
            <div class="intro-gem intro-gem-two"></div>
            <div class="intro-gem intro-gem-three"></div>
          </div>
          <div class="intro-footer">
            <button id="intro-enter" class="intro-enter" type="button" disabled>ENTER THE MINE <span aria-hidden="true">➜</span></button>
            <p id="intro-status" role="status">Preparing your mine...</p>
          </div>
        </div>
      </section>
    </main>
    <script>
      // Tell Telegram's native WebView that visible HTML exists even if the
      // SDK request stalls. The SDK's ready() below repeats this harmlessly.
      try {
        window.TelegramWebviewProxy?.postEvent?.('web_app_ready', '{}');
      } catch {}
    </script>
    <script src="/vendor/telegram-web-app.js"></script>
    <script>window.Telegram?.WebApp?.ready?.();</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
